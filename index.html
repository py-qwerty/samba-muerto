const images=members.map(member=>{if(!member.photo)return null;const image=new Image();image.onload=draw;image.src=member.photo;return image});
function silhouette(){ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,-13,12,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(0,23,25,Math.PI,2*Math.PI);ctx.fill()}
function draw(){
 ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(500,500);
 members.forEach((member,i)=>{
  const start=-Math.PI/2+i*step,mid=start+step/2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,498,start,start+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#173c6030';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.rotate(mid);ctx.translate(375,0);ctx.rotate(-mid);ctx.beginPath();ctx.arc(0,0,43,0,2*Math.PI);ctx.fillStyle='#173c60';ctx.fill();ctx.clip();
  const image=images[i];if(image?.complete&&image.naturalWidth){ctx.drawImage(image,-43,-43,86,86)}else{silhouette()}
  ctx.restore();
 });ctx.restore();
}
function randomIndex(){const limit=Math.floor(4294967296/count)*count,buf=new Uint32Array(1);do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%count}
function showWinner(i){
 const member=members[i];button.replaceChildren();
 if(member.photo){const photo=document.createElement('img');photo.src=member.photo;photo.alt='';button.append(photo)}else{button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10M3 22a9 9 0 0 1 18 0Z"/></svg>'}
 result.textContent='La persona elegida es '+member.name;
 button.setAttribute('aria-label','Ha salido '+member.name+'. Volver a girar la ruleta');
 busy=false;button.disabled=false;document.body.classList.remove('busy');
}
button.addEventListener('click',()=>{
 if(busy)return;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,i=randomIndex(),tau=2*Math.PI,from=angle;
 const desired=(-(i+.5)*step%tau+tau)%tau,delta=(desired-(from%tau)+tau)%tau,to=from+tau*(reduced?1:6)+delta;
 busy=true;button.disabled=true;button.innerHTML=play;button.setAttribute('aria-label','Girando la ruleta');document.body.classList.add('busy');result.textContent='';
 const animation=canvas.animate([{transform:'rotate('+from+'rad)'},{transform:'rotate('+to+'rad)'}],{duration:reduced?1800:5200,easing:reduced?'ease-in-out':'cubic-bezier(.12,.75,.15,1)',fill:'forwards'});
 function finish(){angle=desired;canvas.style.transform='rotate('+desired+'rad)';animation.cancel();showWinner(i)}
 animation.finished.then(finish).catch(finish);
});
draw();
</script></body></html>
